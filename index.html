<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F1E6" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://checkout.razorpay.com" crossorigin />
    <title>Fine gold jewellery</title>
    <!--app-head-->
    <!--
      The opening screen — the store's logo — styled here rather than in the app's CSS so it shows the moment the page
      arrives. The app removes it once the first page and the store's settings are ready
      (see main.tsx); if the app never starts, it fades away on its own after 15 seconds.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #f7f1e6;
        transition: opacity 0.45s ease, visibility 0.45s;
        animation: splash-out 0.45s 15s forwards;
      }
      #splash.gone {
        opacity: 0;
        visibility: hidden;
      }
      #splash .splash-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      /* the store's logo (or, before one is uploaded, the gold lotus), with a soft gold glint */
      #splash .splash-logo {
        position: relative;
        width: min(320px, 74vw);
        height: calc(min(320px, 74vw) * 0.42);
      }
      #splash .splash-logo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        animation: splash-logo-in 0.8s ease-out both;
      }
      #splash .splash-shine {
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 43%, rgba(255, 238, 196, 0.6) 50%, transparent 57%) 0 0 / 260% 100% no-repeat;
        -webkit-mask: url(/api/brand/logo) center / contain no-repeat;
        mask: url(/api/brand/logo) center / contain no-repeat;
        animation: splash-shine 2.6s ease-in-out 0.6s infinite;
      }
      #splash .splash-track {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(165, 122, 44, 0.18);
      }
      #splash .splash-track::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #d9b872, #a57a2c, transparent);
        animation: splash-sweep 1.4s ease-in-out infinite;
      }
      @keyframes splash-logo-in {
        from { opacity: 0; transform: translateY(6px) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
      @keyframes splash-shine {
        0% { background-position: 130% 0; }
        60%, 100% { background-position: -30% 0; }
      }
      @keyframes splash-sweep {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @keyframes splash-out {
        to { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .splash-logo img { animation: none; }
        #splash .splash-shine { display: none; }
        #splash .splash-track::after { animation: none; left: 30%; }
      }
    </style>
    <noscript><style>#splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading">
      <div class="splash-box">
        <span class="splash-logo">
          <img src="/api/brand/logo" alt="" />
          <span class="splash-shine"></span>
        </span>
        <span class="splash-track"></span>
      </div>
    </div>
    <div id="root"></div>
    <noscript>This store needs JavaScript to browse and check out. Please enable it, or call us to order.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
